<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9ece7"><title>Research Map</title><meta name="description" content="适用于不同研究领域的本地研究地图、论文库与 AI 论文阅读工具。"><link rel="stylesheet" href="/style.css"><script src="/core.js" defer></script><script src="/motion.js" defer></script><script src="/journey.js" defer></script><link rel="stylesheet" href="/map-editor.css"><script src="/map-editor-core.js" defer></script><script src="/map-editor.js" defer></script><script src="/context-map.js" defer></script><script src="/tasks.js" defer></script><script src="/citation-network.js" defer></script><script src="/pdf-upload.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header id="topbar" class="topbar"><nav class="view-switch" aria-label="视图切换"><button data-view="map" class="active">研究地图</button><button data-view="library">论文库</button><button data-view="settings">设置</button></nav><div id="context-actions" class="context-actions"></div><div class="top-end"><div id="task-trigger"><button id="activity" type="button" aria-label="查看当前与历史任务" aria-controls="task-popover" aria-expanded="false">任务中心</button><span id="error-count" class="error-count" hidden></span></div><button id="export" class="icon-button" title="导出研究数据" aria-label="导出研究数据">↓</button></div></header>
<aside id="task-popover" class="task-popover" role="region" aria-label="任务中心浮窗" hidden></aside>
<main id="view" aria-live="polite"></main>
<dialog id="modal"><header class="modal-header"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="关闭">×</button></header><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
